name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # The open-source cache provider: the default one is proprietary and only a preview for private repositories.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # The Maven plugin builds with its own local repository; the Axolotl artifacts in it are rebuilt anyway.
      - uses: actions/cache@v6
        with:
          path: |
            build/maven-repo
            !build/maven-repo/org/axl
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', 'axl-maven-plugin/.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-${{ runner.os }}-
      - run: ./gradlew check --continue
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'

  vsix:
    runs-on: ubuntu-latest
    steps:
      # Restoring the Gradle cache, which holds an IntelliJ IDE, can fill the disk of the runner.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew :axl-lsp:vsix
      - uses: actions/upload-artifact@v7
        with:
          name: axolotl-vsix
          path: editors/vscode/axolotl-*.vsix

  intellij:
    runs-on: ubuntu-latest
    steps:
      # verifyPlugin downloads several IDE builds, more than the runner has free by default.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew :axl-intellij:buildPlugin :axl-intellij:verifyPlugin
      - uses: actions/upload-artifact@v7
        with:
          name: axolotl-intellij
          path: axl-intellij/build/distributions/*.zip

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - run: pip install mkdocs==1.6.1
      - run: mkdocs build --strict
