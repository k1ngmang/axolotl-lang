name: Installers

# Builds the native installers on each system and checks each by installing it and running a program.
# The installers carry everything that axl setup installs, so the paths are those of all of it.
# Pushes to main build only the Linux packages: on a private repository macOS runners cost ten times as
# much as Linux ones, and Windows twice. Pull requests, the weekly run, releases and runs by hand build all three.
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [main]
    paths:
      - installers/**
      - axl-cli/**
      - axl-compiler/**
      - axl-compiler-javac/**
      - axl-smap/**
      - axl-runtime/**
      - axl-gradle-plugin/**
      - axl-maven-plugin/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradle/**
      - .github/workflows/installers.yml
  pull_request:
    paths:
      - installers/**
      - axl-cli/**
      - axl-compiler/**
      - axl-compiler-javac/**
      - axl-smap/**
      - axl-runtime/**
      - axl-gradle-plugin/**
      - axl-maven-plugin/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradle/**
      - .github/workflows/installers.yml

permissions:
  contents: read

# A newer push replaces a running build; with the event in the group, it does not cancel a release
# started by hand from main.
concurrency:
  group: installers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        # A release calls this workflow from its tag push, whose ref is the tag.
        system: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["linux"]' || '["linux", "macos", "windows"]') }}
    runs-on: ${{ matrix.system == 'linux' && 'ubuntu-latest' || matrix.system == 'macos' && 'macos-latest' || 'windows-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      # Restoring the Gradle cache, which holds an IntelliJ IDE, can fill the disk of a Linux runner.
      - if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # The bundled repository builds the Maven plugin and the archetype with their own local repository.
      - uses: actions/cache@v6
        with:
          path: |
            build/maven-repo
            !build/maven-repo/org/axl
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', 'axl-maven-plugin/.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Write the program the installed axl runs
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          printf 'package app\n\nimport java.beans.Introspector\n\nfn main() {\n    val name: String? = null\n    println("Hello, " + (name ?: "Axolotl"))\n    println(Introspector.decapitalize("FooBar"))\n}\n' > "$RUNNER_TEMP/smoke/Hello.axl"

      - name: Build the Linux packages
        if: matrix.system == 'linux'
        run: |
          sudo apt-get install -y -q fakeroot
          ./gradlew :axl-cli:nativeInstaller -PinstallerType=deb :axl-cli:linuxTarball
          version=$(ls axl-cli/build/installers/axolotl_*_amd64.deb | sed 's/.*axolotl_\(.*\)_amd64.deb/\1/')
          mv axl-cli/build/installers/axolotl_${version}_amd64.deb axl-cli/build/installers/axolotl-${version}-linux-amd64.deb
      - name: Install the .deb and run axl
        if: matrix.system == 'linux'
        run: |
          sudo apt-get install -y -q ./axl-cli/build/installers/axolotl-*-linux-amd64.deb
          axl --version
          axl run "$RUNNER_TEMP/smoke/Hello.axl" | tee out.txt
          grep -q "Hello, Axolotl" out.txt
          grep -q fooBar out.txt
          test -d ~/.m2/repository/org/axl/axl-maven-plugin
      # The runner has the newest Ubuntu LTS, whose library packages older releases may not have.
      - name: Install the .deb on Debian 12 and Ubuntu 22.04
        if: matrix.system == 'linux'
        run: |
          dpkg-deb -f axl-cli/build/installers/axolotl-*-linux-amd64.deb Depends
          for image in debian:12 ubuntu:22.04; do
            docker run --rm -e DEBIAN_FRONTEND=noninteractive \
              -v "$PWD/axl-cli/build/installers:/installers:ro" -v "$RUNNER_TEMP/smoke:/smoke:ro" "$image" sh -ec '
                apt-get update -q
                apt-get install -y -q /installers/axolotl-*-linux-amd64.deb
                axl run /smoke/Hello.axl | tee /tmp/out.txt
                grep -q "Hello, Axolotl" /tmp/out.txt
                grep -q fooBar /tmp/out.txt'
          done
      - name: Install the tarball with install.sh and run axl
        if: matrix.system == 'linux'
        run: |
          mkdir -p "$RUNNER_TEMP/tarball" "$RUNNER_TEMP/home"
          tar xzf axl-cli/build/installers/axolotl-*-linux-x64.tar.gz -C "$RUNNER_TEMP/tarball"
          HOME="$RUNNER_TEMP/home" sh "$RUNNER_TEMP"/tarball/axolotl-*/install.sh | tee install.txt
          grep -q "not on your PATH yet" install.txt
          axl="$RUNNER_TEMP/home/.local/bin/axl"
          test "$(readlink "$axl")" = "$RUNNER_TEMP/home/.local/share/axolotl/bin/axl"
          "$axl" run "$RUNNER_TEMP/smoke/Hello.axl" | tee out.txt
          grep -q "Hello, Axolotl" out.txt
          # A second run replaces the earlier installation.
          HOME="$RUNNER_TEMP/home" sh "$RUNNER_TEMP"/tarball/axolotl-*/install.sh
          "$axl" --version

      - name: Build the macOS package
        if: matrix.system == 'macos'
        run: |
          ./gradlew :axl-cli:nativeInstaller -PinstallerType=pkg
          version=$(./gradlew -q properties --property version | tr -d '\r' | sed -n 's/^version: //p')
          mv axl-cli/build/installers/axl-*.pkg "axl-cli/build/installers/axolotl-$version-macos-arm64.pkg"
      - name: Install the .pkg and run axl
        if: matrix.system == 'macos'
        run: |
          sudo installer -pkg axl-cli/build/installers/axolotl-*-macos-arm64.pkg -target /
          axl --version
          axl run "$RUNNER_TEMP/smoke/Hello.axl" | tee out.txt
          grep -q "Hello, Axolotl" out.txt
          grep -q fooBar out.txt
          if [ ! -d ~/.m2/repository/org/axl/axl-maven-plugin ]; then
            echo "postinstall did not run axl setup for $(id -un); the console user is '$(stat -f%Su /dev/console)'" >&2
            exit 1
          fi

      - name: Build the Windows installer
        if: matrix.system == 'windows'
        run: |
          ./gradlew :axl-cli:appImage
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$iscc" ]; then choco install innosetup -y --no-progress; fi
          version=$(./gradlew -q properties --property version | tr -d '\r' | sed -n 's/^version: //p')
          "$iscc" "//DAppVersion=$version" "//DImageDir=$(cygpath -w "$PWD/axl-cli/build/jpackage/image/axl")" \
            "//DOutputDir=$(cygpath -w "$PWD/axl-cli/build/installers")" installers/windows/axolotl.iss
      - name: Install with setup.exe and run axl
        if: matrix.system == 'windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem axl-cli/build/installers/axolotl-*-windows-x64-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $axl = "C:\Program Files\Axolotl\axl.exe"
          & $axl --version
          $out = & $axl run "$env:RUNNER_TEMP\smoke\Hello.axl"
          $out
          if (-not ($out -match 'Hello, Axolotl')) { throw 'axl run did not print the greeting' }
          if (-not ($out -match 'fooBar')) { throw 'axl run cannot use java.desktop' }
          $path = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment').Path
          if (-not ($path -like '*C:\Program Files\Axolotl*')) { throw 'axl is not on the PATH' }
          if (-not (Test-Path "$HOME\.m2\repository\org\axl\axl-maven-plugin")) { throw 'axl setup did not run' }

      # The release takes them from its own run; nothing needs them for long.
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.system }}
          retention-days: 5
          path: |
            axl-cli/build/installers/*.deb
            axl-cli/build/installers/*.tar.gz
            axl-cli/build/installers/*.pkg
            axl-cli/build/installers/*.exe
