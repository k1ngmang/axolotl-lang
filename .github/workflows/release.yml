name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Tag to create and release, such as v0.1.1
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Check that the tag is the version of the build
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: .github/scripts/check-versions.sh "$TAG"
      - run: ./gradlew check

  installers:
    needs: verify
    uses: ./.github/workflows/installers.yml

  # Builds with a read-only token; only the job below can write, and it runs no build.
  build:
    needs: installers
    runs-on: ubuntu-latest
    steps:
      # The IntelliJ plugin build downloads an IDE, more than the runner has free by default.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew :axl-cli:distZip :axl-lsp:vsix :axl-intellij:buildPlugin
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            axl-cli/build/distributions/axl-*.zip
            editors/vscode/axolotl-*.vsix
            axl-intellij/build/distributions/axl-intellij-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/release
            docs/guides
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: release-files
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Axolotl ${{ inputs.version || github.ref_name }}
          body_path: .github/release/${{ inputs.version || github.ref_name }}.md
          files: |
            release-files/*
            packages/**/*.zip
            packages/**/*.vsix
            docs/guides/*.pdf
