name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Tag to create and release, such as v0.1.0
        required: true

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Check that the tag is the version of the build
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: .github/scripts/check-versions.sh "$TAG"

  installers:
    needs: versions
    uses: ./.github/workflows/installers.yml

  release:
    needs: installers
    runs-on: ubuntu-latest
    steps:
      # The IntelliJ plugin build downloads an IDE, more than the runner has free by default.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew :axl-cli:distZip :axl-lsp:vsix :axl-intellij:buildPlugin
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: installers-out
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Axolotl ${{ inputs.version || github.ref_name }}
          body_path: .github/release/${{ inputs.version || github.ref_name }}.md
          files: |
            axl-cli/build/distributions/axl-*.zip
            editors/vscode/axolotl-*.vsix
            axl-intellij/build/distributions/axl-intellij-*.zip
            installers-out/*
